name: pr-test-k8s

# 仅 PR 创建/更新时触发一次完整编译+测试
# pull_request_target: 以主仓上下文运行, fork PR 也能读取主仓 vars;
# 工作流文件取自 main, 对本文件的改动需合入 main 后才生效;
# 被测代码需在 checkout 时显式指定 PR head
# fork PR 需维护者打上 ready-hcu 标签后才会在 HCU runner 上运行, 每次新推送需重新打标签 (参考 vllm-das / hcu_probe-das)
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  # pull_request_target 下 github.ref 恒为目标分支, 需按 PR 号区分;
  # 打其他标签触发的 run 会被跳过, 单独分组以免取消正在运行的测试
  group: pr-test-k8s-${{ (github.event.action == 'labeled' && github.event.label.name != 'ready-hcu') && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TORCH_VERSION: "2.11.0"
  PYPI_URL: ${{ vars.PYPI_URL }}

jobs:
  build:
    name: K8s build (DTK ${{ matrix.dtk }})
    # 主仓分支或组织成员/协作者提的 PR 直接运行;
    # 其他 fork PR 只在维护者打上 ready-hcu 的那一刻运行 (只有 triage 及以上权限能打标签),
    # 之后新推送的代码不会自动运行, 需维护者复核后移除并重新打上 ready-hcu
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ready-hcu') &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
       github.event.action == 'labeled')
    runs-on: hygon-build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: "2604"
            image: BASE_IMAGE_UBUNTU_DTK2604_PY310
            aicc: "1.0.0"
          - dtk: "2610"
            image: BASE_IMAGE_UBUNTU_DTK2610_PY312
            aicc: "2.0.0"
    env:
      # 可选：覆盖 DTK 默认编译目标。
      PYTORCH_ROCM_ARCH: ${{ vars.SPCONV_K8S_ROCM_ARCH }}
    container:
      image: ${{ vars[matrix.image] }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # pull_request_target 下 checkout 默认拒绝拉取 fork 代码, 需显式允许;
          # fork 代码仅在维护者打 ready-hcu 标签后运行, 且不保留 GITHUB_TOKEN (persist-credentials: false)
          allow-unsafe-pr-checkout: true

      - name: Integrate latest main
        # 测试的应该是合入 main 之后的结果: 先把最新 main 合并进当前分支再编译
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail
          # 镜像默认用户与 checkout 目录属主不一致时 git 拒绝操作, 显式豁免
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # fork PR 的 origin 指向 fork 仓库, 需从主仓拉取最新目标分支
          git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" \
              "+refs/heads/${BASE_REF}:refs/remotes/ci-base/${BASE_REF}"
          target_sha="$(git rev-parse "ci-base/${BASE_REF}")"
          git -c user.name='spconv CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          echo "Integrated ${BASE_REF} ${target_sha}"

      - name: 准备 pip 内网源
        shell: bash
        run: |
          # 从对应 DTK 的内网源安装 PyTorch
          TRUSTED_HOST="${PIP_INDEX#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PIP_INDEX}" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
        env:
          PIP_INDEX: ${{ env.PYPI_URL }}/nightly/dtk${{ matrix.dtk }}/+simple/

      - name: Install AICC
        shell: bash
        run: |
          wget "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          bash hcu_llvm_installer.sh --major "${AICC_VERSION}"
        env:
          AICC_VERSION: ${{ matrix.aicc }}
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: install deps
        shell: bash
        run: |
          set -euo pipefail
          # nightly/dtk{dtk} 是 devpi 的链式索引, 已聚合真实上传目录
          # (dtk2604 -> das_nightly/dtk2604-rc4, dtk2610 -> das_nightly/dtk2610),
          # 无需再额外加 --extra-index-url。
          # 必须按后缀正则筛 wheel: pip 的 "==2.11.0+dtk2604.*" 对 local version 不生效
          # (版本匹配时会丢弃 + 之后的部分), 而裸装 torch 会按版本排序选中
          # "2.11.0+das.opt1.dtk2604.*" 分支构建。正则取第一个匹配即为最新版。
          torch_versions="$(python3 -m pip index versions --only-binary=:all: torch)"
          torch_wheel_version="$(printf '%s\n' "$torch_versions" | python3 -c '
          import re, sys
          version, dtk = sys.argv[1:]
          prefix = re.escape(version + "+dtk" + dtk)
          for line in sys.stdin:
              if line.startswith("Available versions:"):
                  for candidate in line.split(":", 1)[1].strip().split(", "):
                      if re.fullmatch(prefix + r"(?:[.-][a-zA-Z0-9]+)*", candidate):
                          print(candidate)
                          sys.exit(0)
          sys.exit(f"No compatible torch wheel found for {version}+dtk{dtk}")
          ' "${TORCH_VERSION}" "${{ matrix.dtk }}")"
          echo "Installing torch==${torch_wheel_version}"
          python3 -m pip install --no-cache-dir numpy==1.26.4 "torch==${torch_wheel_version}" \
              ninja wheel setuptools
          mkdir -p ci-bundle
          printf '%s\n' "$torch_wheel_version" > ci-bundle/torch-version.txt

      - name: 编译 wheel
        shell: bash
        run: |
          source /opt/dtk/env.sh
          set -euo pipefail
          export PYTORCH_ROCM_ARCH="${PYTORCH_ROCM_ARCH:-${AMDGPU_TARGETS:-}}"
          : "${PYTORCH_ROCM_ARCH:?DTK did not set AMDGPU_TARGETS. Set SPCONV_K8S_ROCM_ARCH to supply the targets.}"
          echo "PYTORCH_ROCM_ARCH=${PYTORCH_ROCM_ARCH}"
          CXX=hipcc python3 setup.py bdist_wheel
          mkdir -p ci-bundle/test
          cp dist/*.whl ci-bundle/
          cp test/test_sparse_conv.py ci-bundle/test/

      # 编译和单卡测试使用不同 Runner，通过 artifact 传递同一 DTK 环境的产物。
      - name: 上传 wheel 和对应测试
        uses: actions/upload-artifact@v4
        with:
          name: spconv-k8s-dtk${{ matrix.dtk }}
          overwrite: true
          path: ci-bundle/
          if-no-files-found: error
          retention-days: 7

  test:
    name: K8s single-card test (DTK ${{ matrix.dtk }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: "2604"
            image: BASE_IMAGE_UBUNTU_DTK2604_PY310
            aicc: "1.0.0"
          - dtk: "2610"
            image: BASE_IMAGE_UBUNTU_DTK2610_PY312
            aicc: "2.0.0"
    runs-on: hygon-bw1100-1card
    timeout-minutes: 60
    container:
      image: ${{ vars[matrix.image] }}
    steps:
      - name: 下载 wheel 和对应测试
        uses: actions/download-artifact@v4
        with:
          name: spconv-k8s-dtk${{ matrix.dtk }}
          path: ci-bundle

      - name: 准备 pip 内网源
        shell: bash
        run: |
          # 从对应 DTK 的内网源安装 PyTorch
          TRUSTED_HOST="${PIP_INDEX#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PIP_INDEX}" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
        env:
          PIP_INDEX: ${{ env.PYPI_URL }}/nightly/dtk${{ matrix.dtk }}/+simple/

      - name: 安装测试依赖和 wheel
        shell: bash
        run: |
          set -euo pipefail
          # 版本由 build job 选定并随 artifact 传来, 这里直接复用, 保证两个 job 装的是同一个包
          read -r torch_wheel_version < ci-bundle/torch-version.txt
          python3 -m pip install --no-cache-dir numpy==1.26.4 "torch==${torch_wheel_version}" pytest
          pip install --no-deps --force-reinstall ci-bundle/*.whl

      - name: 运行单卡测试
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          source /opt/dtk/env.sh
          set -euo pipefail
          cd ci-bundle/test
          python3 -c "import torch; assert torch.cuda.is_available(), 'HCU unavailable'"
          python3 -c "import spconv; print(f'spconv={spconv.__version__}')"
          python3 -m pytest -v -p no:cacheprovider --tb=short test_sparse_conv.py
