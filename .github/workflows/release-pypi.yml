name: release-pypi

on:
  # ---- 合入 main 分支后触发 ----
  push:
    branches:
      - main

  # ---- 手动触发，仅构建产物，不上传 NIGHTLY ----
  workflow_dispatch:

permissions:
  contents: read
  # CIUpload 上传前需查询关联 PR (只读)
  pull-requests: read
  # CIUpload 上报需读取 check-run 统计 (只读)
  checks: read

env:
  TORCH_VERSION: "2.11.0"
  PYPI_URL: ${{ vars.PYPI_URL }}
  # 显式控制 ninja 并行度以缩短 HIP 内核编译时间
  MAX_JOBS: "32"

jobs:
  compile:
    # ---- 并发控制: 同一分支 + 同一 DTK 版本的 job 只保留最新一个 ----
    concurrency:
      group: release-nightly-hcu-${{ github.ref }}-dtk${{ matrix.dtk }}
      cancel-in-progress: true
    # ---- 自托管 runner，在 Docker 容器内执行 ----
    # 本仓库没有带 hcu 标签的 runner, 加上会因标签取交集为空而一直排队
    runs-on: self-hosted
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: "2604"
            image: BASE_IMAGE_UBUNTU_DTK2604_PY310
            aicc: "1.0.0"
            dtk_pkg_name: DTK-26.04-rc4-centos8-x86_64.tar.gz
          - dtk: "2610"
            image: BASE_IMAGE_UBUNTU_DTK2610_PY312
            aicc: "2.0.0"
    container:
      image: ${{ vars[matrix.image] }}
      options: >-
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打印环境变量
        run: |
          echo "TORCH_VERSION=${TORCH_VERSION}"
          echo "DTK_VERSION=${{ matrix.dtk }}"
          echo "PYPI_URL=${PYPI_URL}"

      - name: 准备构建工具
        shell: bash
        run: |
          # 镜像自带 wget, 只需配置内网 pip 源
          TRUSTED_HOST="${PIP_INDEX#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PIP_INDEX}" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
        env:
          PIP_INDEX: ${{ env.PYPI_URL }}/nightly/dtk${{ matrix.dtk }}/+simple/

      - name: Install AICC
        shell: bash
        run: |
          wget "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          bash hcu_llvm_installer.sh --major "${AICC_VERSION}"
        env:
          AICC_VERSION: ${{ matrix.aicc }}
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: install deps
        shell: bash
        run: |
          pip install --no-cache-dir numpy==1.26.4 torch==${TORCH_VERSION} ninja wheel setuptools

      - name: build wheel
        shell: bash
        run: |
          source /opt/dtk/env.sh
          # setup.py 的 ROCM_PATH 默认 /opt/dtk; HIP 源码需 hipcc 作为 host 编译器
          CXX=hipcc python3 setup.py bdist_wheel

      - name: 生成 manylinux wheel
        run: |
          bash .github/scripts/manylinux_repair.sh dist dist-manylinux

      - name: Apply DAS local version to wheels
        run: |
          pip install --no-cache-dir ciupload
          WHEEL_COMMIT_SHA="$(git rev-parse HEAD)"
          CIUpload REPAIR \
            --dtk_version "${{ matrix.dtk }}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f dist-manylinux/*.whl

      - name: 上传 NIGHTLY
        if: ${{ github.event_name == 'push' }}
        env:
          # CIUpload 需查关联 PR, 注入自动 token
          GITHUB_TOKEN: ${{ github.token }}
          # 经 env 传入, 避免密码在 run 里被表达式直接展开进命令行
          DTK_VERSION: ${{ matrix.dtk }}
          DTK_PKG_NAME: ${{ matrix.dtk_pkg_name }}
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        shell: bash
        run: |
          if [[ "${DTK_VERSION}" == "2604" ]]; then
            dtk_args=(--dtk_pkg_name "${DTK_PKG_NAME}")
          else
            dtk_args=(--dtk_version "${DTK_VERSION}")
          fi
          CIUpload NIGHTLY \
            --devpi_url "${PYPI_URL}" \
            --password "${PYPI_PASSWORD}" \
            "${dtk_args[@]}" \
            -f output/*.whl --record

      # 容器内以 root 运行, workspace 里的文件会归 root 所有,
      # 宿主机上后续 job 的 checkout 无法清理, 退出前清空
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
